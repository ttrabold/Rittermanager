<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sir Grindalot – Vom Knappen zur Legende</title>
<meta name="theme-color" content="#1b1610">
<meta name="description" content="Werde vom Knappen zur Legende – ein mittelalterliches Browser-Rollenspiel.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sir Grindalot">
<!-- Die Version steht nur hier (V). Sie hängt als ?v=… an allen Dateien und an sw.js, damit Browser nach einem Update keine alten Dateien aus dem Cache nehmen. -->
<script>var V="0.2.1";document.write('<link rel="stylesheet" href="css/style.css?v='+V+'">')</script>
</head>
<body>
<div id="app"></div>
<!-- Klassische Skripte (keine ES-Module), damit das Spiel auch lokal per file:// läuft. Reihenfolge ist wichtig (gleich in tests/index.html).
     Die Version V steht oben im Kopf; document.write lädt sie der Reihe nach und synchron. -->
<script>
["js/i18n.js","js/lang/de.js","js/lang/en.js","js/util.js","js/data.js","js/state.js","js/audio.js","js/speech.js","js/unlock.js","js/art.js","js/towerart.js","js/professions.js","js/weapons.js","js/loot.js","js/day.js","js/tavern.js","js/screens.js","js/combat.js","js/towerboss.js","js/help.js","js/companions.js","js/events.js","js/story.js","js/endgame.js","js/bestiary.js","js/main.js"].forEach(function(f){document.write('<script src="'+f+'?v='+V+'"><\/script>')});
</script>
</body>
</html>
