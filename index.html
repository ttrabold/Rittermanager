<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritter Manager</title>
<style>
:root{--bg:#f3ead6;--card:#fffaf0;--ink:#2d2417;--mut:#7a6a50;--acc:#8b1e1e;--line:#d8c9a6;--sky1:#78b4e3;--sky2:#f9d9a6;--grass:#6e9a4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1610;--card:#2a2218;--ink:#f1e6cf;--mut:#b5a380;--acc:#d9534f;--line:#4a3d2a;--sky1:#0b1430;--sky2:#3b3157;--grass:#3d5a2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1610;--card:#2a2218;--ink:#f1e6cf;--mut:#b5a380;--acc:#d9534f;--line:#4a3d2a;--sky1:#0b1430;--sky2:#3b3157;--grass:#3d5a2c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;max-width:560px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top span{color:var(--mut);font-size:14px}
.scene{height:190px;border-radius:14px;border:2px solid var(--line);background:linear-gradient(var(--sky1),var(--sky2));position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.bg{position:absolute;left:0;bottom:0;width:100%;height:100%;z-index:0;pointer-events:none}
:root{--mt1:#b3c0d6;--mt2:#8494ad;--snow:#f4f7fb;--hill:#6f9a52;--tree:#3d6a34;--sun:#fff3c4;--glow:#ffd98a;--cloud:#fff;--cop:.85;--star:0;--plat:#00000030}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mt1:#2a3354;--mt2:#1d2540;--snow:#c9d3ea;--hill:#20331d;--tree:#11200f;--sun:#f3efd2;--glow:#9fb4ff;--cloud:#7c86a8;--cop:.35;--star:1;--plat:#00000055}}
:root[data-theme="dark"]{--mt1:#2a3354;--mt2:#1d2540;--snow:#c9d3ea;--hill:#20331d;--tree:#11200f;--sun:#f3efd2;--glow:#9fb4ff;--cloud:#7c86a8;--cop:.35;--star:1;--plat:#00000055}
.cl{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(720px)}}
.ffy{animation:ffy 3.5s ease-in-out infinite alternate}
@keyframes ffy{from{transform:translate(0,0);opacity:.15}to{transform:translate(9px,-12px);opacity:1}}
.k .br{animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{transform:translateY(1.3px)}}
.fs .es:before,.fs .ps:before{content:"";position:absolute;left:50%;bottom:-8px;width:150px;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--plat),transparent)}
.hov{animation:hov 3s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-5px)}}
.flap{transform-box:fill-box;transform-origin:100% 100%;animation:flap 1.4s ease-in-out infinite alternate}.flap.r{transform-origin:0 100%;animation-direction:alternate-reverse}
@keyframes flap{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.2s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.glow{animation:pl2 1.2s ease-in-out infinite alternate}@keyframes pl2{from{opacity:.6}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cl,.ffy,.k .br,.tw,.fk,.fl2,.dr,.rot,.pl,.wv,.hov,.flap,.sway,.glow{animation:none}.koE,.koP,.koB{animation-duration:.01s}.rain,.blink,.flick{animation:none}}
.scene svg.k{height:150px;position:relative;z-index:2;margin-bottom:8px}
.castle{position:absolute;right:8px;bottom:26px;height:90px;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:15px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{font:inherit;font-size:15px;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button small{display:block;color:var(--mut);font-size:12px}
button.p small{color:#fbe3e3}
.msg{margin-top:10px;padding:8px 12px;border-left:4px solid var(--acc);background:var(--card);border-radius:6px;font-size:15px;min-height:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
h3{margin:4px 0 6px;font-size:16px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;margin-bottom:6px}
.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px);filter:brightness(1.8)}60%{transform:translateX(8px)}}
.dmg{position:absolute;top:30px;font-weight:bold;font-size:24px;color:#c0221f;z-index:5;animation:up 1s forwards;text-shadow:0 1px 0 #fff}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.moves button{font-size:26px;padding:10px 4px}
.moves button small{font-size:12px}
.mut{color:var(--mut);font-size:13px}
.fs{height:290px;display:block}
.fs .box{position:absolute;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;width:170px;z-index:6}
.fs .eb{top:8px;left:8px}.fs .pb{bottom:40px;right:8px}
.fs .es{position:absolute;right:14px;top:50px;z-index:2}.fs .es svg.k{height:105px;margin:0}
.fs .ps{position:absolute;left:10px;bottom:28px;z-index:3}.fs .ps svg.k{height:140px;margin:0}
.fs .dmg{top:20px}
.fs .es.big svg.k{height:132px}
body{padding-bottom:64px}
#snd{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:50}
#snd button{min-height:36px;padding:6px 12px;font-size:13px;border-radius:18px;box-shadow:0 1px 4px #0004}
#snd .off{opacity:.55;text-decoration:line-through}
.fs .lg{display:block}
.lungeP{animation:lungeP .55s}
@keyframes lungeP{35%{transform:translate(75px,-18px) rotate(8deg)}100%{transform:none}}
.lungeE{animation:lungeE .55s 1.05s both}
@keyframes lungeE{35%{transform:translate(-75px,14px)}100%{transform:none}}
.fs .es.hit{animation-delay:.3s}
.fs .ps.hit.late{animation-delay:1.3s}
.dmg{opacity:0;animation-delay:.3s;animation-fill-mode:both}
.dmg.late{animation-delay:1.3s}
@keyframes up{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26px)}}
.vfx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.vE{position:absolute;right:18px;top:45px;width:120px;height:120px}
.vP{position:absolute;left:5px;bottom:28px;width:130px;height:150px}
svg.vP{transform:scaleX(-1)}
.sl{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;filter:drop-shadow(0 0 5px #fff);animation:draw .3s calc(var(--d) + .2s) forwards,fadeo .25s calc(var(--d) + .55s) forwards}
.sl.r{stroke:#ff5a4d;filter:drop-shadow(0 0 6px #f00)}
.sl.b{animation-delay:calc(var(--d) + .3s),calc(var(--d) + .65s)}
.sl.c{animation-delay:calc(var(--d) + .4s),calc(var(--d) + .75s)}
.sl.sp{stroke:#9be3ff;stroke-dasharray:280;stroke-dashoffset:280;animation:draw .7s calc(var(--d) + .3s) forwards,fadeo .3s calc(var(--d) + 1s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeo{to{opacity:0}}
.ring{border:4px solid #ffd54a;border-radius:50%;opacity:0;animation:ring .6s calc(var(--d) + .3s) forwards}
.ring.red{border-color:#ff5a4d}.ring.r2{animation-delay:calc(var(--d) + .5s)}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}
.fly{position:absolute;left:80px;top:150px;font-size:34px;opacity:0;animation:fly .5s calc(var(--d) + .1s) forwards}
@keyframes fly{0%{left:80px;opacity:1}85%{opacity:1}100%{left:calc(100% - 140px);opacity:0}}
.aura,.blast,.rise,.cloud,.spin,.drops,.mt,.whirl{display:flex;align-items:center;justify-content:center;opacity:0}
.aura{font-size:56px;animation:aura .9s var(--d) forwards}
.blast{font-size:80px;animation:aura .8s calc(var(--d) + .6s) forwards}
.cloud{font-size:60px;animation:aura 1.1s calc(var(--d) + .3s) forwards}
@keyframes aura{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.4) translateY(-20px);opacity:0}}
.bubble{border:4px solid #5dade2;border-radius:50%;background:radial-gradient(#5dade222,#5dade299);opacity:0;animation:bub 1.2s var(--d) forwards}
@keyframes bub{0%{transform:scale(.4);opacity:0}25%{opacity:1;transform:scale(1)}80%{opacity:.8}100%{opacity:0;transform:scale(1.05)}}
.whirl{font-size:70px;animation:whirl .9s calc(var(--d) + .2s) forwards}
@keyframes whirl{0%{transform:rotate(0) scale(.4);opacity:0}30%{opacity:1}100%{transform:rotate(720deg) scale(1.3);opacity:0}}
.dragon{position:absolute;top:30px;left:20px;font-size:80px;opacity:0;animation:drag .9s calc(var(--d) + .1s) forwards}
@keyframes drag{0%{left:20px;opacity:0;transform:scale(.5)}25%{opacity:1}100%{left:calc(100% - 160px);opacity:0;transform:scale(1.3)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .35s calc(var(--d) + .3s)}
.flash.fire{background:#ff7a1a}
@keyframes fl{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}
.drops{align-items:flex-start;font-size:24px;animation:dr 1s calc(var(--d) + .5s) forwards}
@keyframes dr{0%{transform:translateY(-10px);opacity:1}100%{transform:translateY(60px);opacity:0}}
.rise{align-items:flex-start;font-size:30px;animation:ri 1.1s var(--d) forwards}
@keyframes ri{0%{transform:translateY(60px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.spin{align-items:flex-start;font-size:44px;animation:spn 1.2s calc(var(--d) + .3s) forwards}
@keyframes spn{0%{transform:rotate(0);opacity:0}20%{opacity:1}100%{transform:rotate(360deg);opacity:0}}
.mt{font-weight:bold;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;animation:ri 1s calc(var(--d) + .2s) forwards}
.doc{font-size:15px;line-height:1.5}.doc h1{font-size:21px;margin:4px 0 10px}.doc h2{font-size:18px;margin:18px 0 6px;padding-top:8px;border-top:1px solid var(--line)}.doc h3{margin-top:12px}
.doc .tbl{overflow-x:auto;margin:6px 0}.doc table{border-collapse:collapse;font-size:14px;min-width:100%}.doc th,.doc td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}.doc th{background:var(--bg)}
.doc blockquote{margin:8px 0;padding:6px 10px;border-left:4px solid var(--acc);background:var(--bg);border-radius:6px}.doc a{color:var(--acc)}.doc ul,.doc ol{padding-left:22px;margin:6px 0}.doc hr{display:none}
.kw{transform-origin:50% 95%}
.koE{animation:koE 1s .75s cubic-bezier(.5,0,.8,.4) forwards}@keyframes koE{25%{transform:translateY(-6px) rotate(6deg)}100%{transform:translateY(-4px) rotate(-82deg);filter:grayscale(1) brightness(.7);opacity:.6}}
.koP{animation:koP 1s 1.75s cubic-bezier(.5,0,.8,.4) forwards}@keyframes koP{25%{transform:translateY(-6px) rotate(-6deg)}100%{transform:translateY(-4px) rotate(82deg);filter:grayscale(1) brightness(.7);opacity:.6}}
.koB{animation:koB 1.7s .75s ease-in forwards}@keyframes koB{8%{transform:translateX(-5px)}16%{transform:translateX(5px)}24%{transform:translateX(-5px);filter:brightness(1.8)}32%{transform:translateX(4px)}45%{transform:none;filter:brightness(2.5)}100%{transform:scale(.4) translateY(40px);opacity:0;filter:brightness(4) blur(4px)}}
.cheer{animation:cheer .45s 2s 2 ease-out}.cheerE{animation:cheer .45s 3s 2 ease-out}@keyframes cheer{50%{transform:translateY(-14px)}}
.kot,.soul{display:flex;align-items:center;justify-content:center;opacity:0}
.kot{font-weight:bold;font-size:28px;color:#fff;letter-spacing:1px;text-shadow:0 2px 4px #000,0 0 12px #c0221f;animation:kot .6s calc(var(--d) + 1.6s) forwards}
@keyframes kot{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
.soul{align-items:flex-start;font-size:30px;animation:soul 2.2s calc(var(--d) + 1.5s) forwards}@keyframes soul{0%{opacity:0;transform:translateY(40px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-50px)}}
.rain{animation:rain .5s linear infinite}@keyframes rain{from{transform:translate(8px,-30px)}to{transform:translate(-8px,30px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.flick{opacity:0;animation:flick 4.5s infinite}@keyframes flick{0%,88%,100%{opacity:0}90%,94%{opacity:1}92%{opacity:.3}}
.tl{font-size:11px;color:var(--mut);font-style:italic}
.fk{transform-box:fill-box;transform-origin:50% 100%;animation:fk .4s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,.7) rotate(-5deg);opacity:.85}to{transform:scale(1.1,1.25) rotate(5deg);opacity:1}}
.tw{animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.dr{animation:dr2 1.4s ease-in infinite}
@keyframes dr2{0%{transform:translateY(0);opacity:1}100%{transform:translateY(28px);opacity:0}}
.fl2{animation:fl2 2s ease-out infinite}
@keyframes fl2{0%{transform:translateY(0) scale(.8);opacity:.9}100%{transform:translateY(-34px) scale(1.4);opacity:0}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pl{animation:pl 1.6s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.08}to{opacity:.4}}
.wv{transform-box:fill-box;transform-origin:100% 0;animation:wv 1.2s ease-in-out infinite alternate}
@keyframes wv{from{transform:skewX(-6deg)}to{transform:skewX(8deg)}}
</style>

<body>
<div id="app"></div>
<script>
const AC=["#6b4a2b","#8b6b43","#9aa3ab","#c3ccd4","#7fd6e0"],WC=["#a67c52","#b8bec4","#dfe6ec","#f1f5f9","#ff8a45"],SC=["none","#8b5a2b","#8f98a0","#c0392b"];
const W=[["Holzschwert",0,0],["Eisenschwert",40,3],["Stahlschwert",120,6],["Langschwert",300,10],["Drachenklinge",700,16]];
const A=[["Lumpen",0,0],["Lederwams",40,2],["Kettenhemd",120,4],["Plattenpanzer",300,7],["Mithril-Rüstung",700,11]];
const SH=[["Kein Schild",0,0],["Holzschild",30,1],["Eisenschild",100,2],["Turmschild",280,4]];
const RANKF={"Knappe":"Knappin","Ritter":"Ritterin","Edelritter":"Edelritterin","Baron":"Baronin","Graf":"Gräfin","Herzog":"Herzogin","Held des Königreichs":"Heldin des Königreichs","Halbgott":"Halbgöttin"};
const RANKS=[[0,"Knappe"],[50,"Ritter"],[150,"Edelritter"],[400,"Baron"],[900,"Graf"],[2000,"Herzog"],[5000,"Held des Königreichs"],[10000,"Unsterbliche Legende"],[25000,"Halbgott"]];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fresh=()=>({name:"Sir Kunibert",sex:"m",day:1,en:6,gold:20,ruhm:0,st:3,au:3,ge:3,w:0,a:0,s:0,exp:0,it:{h:2,H:0,k:0,e:0,g:0,x:0},own:[],ew:null,ea:null,boss:0,troph:0,tt:[],title:null,crits:0,flawless:0,close:0,bk:[],star:0,tbest:0,tunl:0,wins:0,losses:0});
const AU={ctx:null,mus:true,sfx:true,mode:null,want:null,timer:null,step:0,unlocked:false};
try{const a=JSON.parse(localStorage.getItem("ritter_au")||"{}");if(a.m===false)AU.mus=false;if(a.s===false)AU.sfx=false}catch(e){}
const auSave=()=>{try{localStorage.setItem("ritter_au",JSON.stringify({m:AU.mus,s:AU.sfx}))}catch(e){}};
function ac(){if(!AU.ctx){try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)();musGraph()}catch(e){return null}}if(AU.ctx.state==="suspended")AU.ctx.resume();return AU.ctx}
function tone(f,t0,d,type,vol,dest,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(dest||c.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(t0,d,vol){const c=AU.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(c.destination);s.start(t0)}
function sfx(n){if(!AU.sfx)return;const c=ac();if(!c)return;const t=c.currentTime,D=c.destination,arp=(a,g,ty)=>a.forEach((f,i)=>tone(f,t+i*g,g*1.6,ty||"triangle",.12));
 switch(n){
 case"click":tone(660,t,.05,"square",.05);break;
 case"hit":noise(t,.18,.25);tone(220,t,.15,"sawtooth",.15,D,70);break;
 case"crit":noise(t,.25,.3);tone(330,t,.2,"sawtooth",.18,D,60);tone(990,t+.05,.2,"square",.08);break;
 case"miss":tone(500,t,.2,"sine",.1,D,200);break;
 case"hurt":noise(t,.2,.2);tone(160,t,.3,"sawtooth",.18,D,50);break;
 case"heal":arp([523,659,784],.09);break;
 case"buff":tone(300,t,.35,"triangle",.14,D,900);break;
 case"coin":tone(988,t,.07,"square",.07);tone(1319,t+.07,.2,"square",.07);break;
 case"poison":tone(220,t,.4,"sine",.15,D,110);tone(233,t,.4,"sine",.1,D,120);break;
 case"win":arp([523,659,784,1047],.13);break;
 case"lose":arp([392,330,262,196],.2,"sawtooth");break;
 case"level":arp([523,659,784,1047,1319],.09);break;
 case"fall":noise(t,.35,.3);tone(110,t,.4,"sine",.35,D,40);break;
 case"gong":tone(98,t,3,"sine",.28);tone(147,t,2.5,"sine",.12);tone(196,t,2,"triangle",.06);tone(49,t,3.5,"sine",.2);noise(t,.5,.06);break;
 case"boom":noise(t,.8,.35);tone(80,t,.9,"sawtooth",.2,D,30);tone(660,t+.05,.6,"triangle",.08,D,1320);break;}}
// ---- Musik-Engine: Synth mit Hall, Instrumenten und Stücken je Situation ----
function musGraph(){const c=AU.ctx;AU.mg=c.createGain();AU.mg.gain.value=0;AU.lp=c.createBiquadFilter();AU.lp.type="lowpass";AU.lp.frequency.value=18000;
 const cp=c.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=4;AU.mg.connect(AU.lp);AU.lp.connect(cp);cp.connect(c.destination);
 const len=Math.floor(c.sampleRate*2.6),ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
 const cv=c.createConvolver();cv.buffer=ir;AU.rv=c.createGain();AU.rv.gain.value=.5;AU.rv.connect(cv);cv.connect(AU.mg);
 const nl=c.sampleRate;AU.nb=c.createBuffer(1,nl,c.sampleRate);const nd=AU.nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function nt(t,m,d,o){const c=AU.ctx,g=c.createGain(),f=mtof(m),v=o.v||.08,a=o.a||.01,r=o.r||.3,n=o.n||1;let into=g;
 if(o.f){const fl=c.createBiquadFilter();fl.type=o.bp?"bandpass":"lowpass";fl.frequency.value=o.f;fl.Q.value=o.q||.8;fl.connect(g);into=fl}
 for(let k=0;k<n;k++){const os=c.createOscillator();os.type=o.w||"triangle";os.frequency.value=f;os.detune.value=(k-(n-1)/2)*(o.dt||0);

function pick(t){let r=Math.random()*Object.values(t).reduce((a,b)=>a+b,0);for(const k in t){if(r<t[k])return k;r-=t[k]}return Object.keys(t)[0]}
function dropMat(f,l){const got={},add=(k,n)=>{S.mat[k]+=n;got[k]=(got[k]||0)+n};
 if(f.boss){add("ds",rnd(1,2));add("ak",2);add("mi",rnd(1,2));add(pick({hk:1,fb:1,gp:1}),2)}
 else{const t=DROP[f.et]||DROP.Ritter;add(pick(t),1);if(Math.random()<.5)add(pick(t),1);if(f.lvl>=8&&Math.random()<.15)add("mi",1)}
 l.push("Materialien: "+Object.entries(got).map(([k,n])=>`${MT(k).e} ${MT(k).n} ×${n}`).join(", "))}
const PR={sm:{n:"Schmied",e:"🔨"},al:{n:"Alchemie",e:"⚗️"},ve:{n:"Verzauberer",e:"🔮"}};

const upCost=(k,n)=>{const m=k==="w"?{ez:2*n}:{le:2*n,ez:n};if(n>=3)m.mi=n-2;if(n>=5)m.ds=1;return m};
const maxUp=()=>Math.min(5,Math.ceil(S.pr.sm.lv/2));
const slots=()=>S.pr.ve.lv>=6?2:1;
const hasM=m=>Object.entries(m).every(([k,n])=>S.mat[k]>=n);
const costH=(m,g)=>Object.entries(m).map(([k,n])=>`<span style="color:${S.mat[k]>=n?"inherit":"var(--acc)"}">${MT(k).e}${n}</span>`).join(" ")+(g?` <span style="color:${S.gold>=g?"inherit":"var(--acc)"}">🪙${g}</span>`:"");

function prXP(p,x,l){const P=S.pr[p];if(P.lv>=10)return;P.xp+=x;while(P.lv<10&&P.xp>=prNeed(P.lv)){P.xp-=prNeed(P.lv);P.lv++;sfx("level");l.push(`<b>${PR[p].e} ${PR[p].n} steigt auf Stufe ${P.lv}!</b>`)}}
function work1(p,lv,m,g,act){if(S.en<1||S.pr[p].lv<lv||!hasM(m)||S.gold<(g||0))return;S.en--;S.gold-=g||0;for(const k in m)S.mat[k]-=m[k];const l=[act()];prXP(p,3+lv,l);wsMsg=l.join("<br>");sfx("buff");save();workshop()}
function brew(id){const r=ALC.find(x=>x.id===id),t=IT.find(x=>x.k===id),n=S.pr.al.lv>=r.lv+3?2:1;work1("al",r.lv,r.m,0,()=>{S.it[id]+=n;return `Du braust ${n}× ${t.e} <b>${t.n}</b>.`})}
function forge(id){const r=SMI.find(x=>x.id===id);if(S.own.includes(id))return;work1("sm",r.lv,r.m,r.g,()=>{const l=[];giveE(id,l);return "Du schmiedest: "+l.join(" ")})}
function upgrade(k){const n=upl(k)+1;if(n>maxUp())return;work1("sm",1,upCost(k,n),10*n,()=>{S.up[ikey(k)]=n;return `Deine ${k==="w"?"Waffe":"Rüstung"} ist jetzt <b>${iname(k)}</b>.`})}
function rune(id){const r=RU.find(x=>x.id===id),key=ikey(r.s),cur=S.ru[key]||[];if(cur.length>=slots()||cur.includes(id))return;work1("ve",r.lv,r.m,0,()=>{S.ru[key]=[...cur,id];return `Die <b>${r.n}</b> leuchtet auf deiner ${r.s==="w"?"Waffe":"Rüstung"}. ✦`})}
function unrune(k,i){const key=ikey(k),cur=S.ru[key]||[],r=RU.find(x=>x.id===cur[i]);cur.splice(i,1);S.ru[key]=cur;wsMsg=`Die ${r?r.n:"Rune"} zerfällt zu Staub.`;save();workshop()}
function trade(k,n){const m=MT(k);if(n>0){if(S.gold<m.p)return;S.gold-=m.p;S.mat[k]++;sfx("coin")}else{if(S.mat[k]<1)return;S.mat[k]--;S.gold+=Math.floor(m.p*.4);sfx("coin")}save();trader()}

{n:"Schattenkaiser Nyx",L:45,req:21000,hp:5.3,atk:1.48,def:1.65,tint:"#1a1a2e",mv:[["Schattenhieb",1.2,92,"",4],["Albtraum",1.2,85,"stun",3],["Nachtklinge",2,80,"",3],["Leere",2.8,68,"",2]]},
{n:"Der Weltenfresser",L:50,req:28000,hp:5.8,atk:1.5,def:1.7,tint:"#4a148c",mv:[["Zermalmen",1.2,92,"",3],["Urfeuer",1.3,88,"burn",3],["Weltengift",1.1,90,"poison",2],["Zeitriss",1.4,85,"stun",2],["Weltenende",3,68,"",2]]}];
function mk(L,t,boss){
 const sc=1+.08*S.star,hp=Math.round((40+L*12)*t.hp*sc);
 return {lvl:L,name:boss?t.n:`${t.t} ${ENS[rnd(0,ENS.length-1)]}`,ehp:hp,emax:hp,atk:(3+L*2)*t.atk*sc,def:Math.floor(L*.8*t.def),tier:Math.min(4,Math.floor(L/2)),tint:t.tint||"#6b2d8f",mv:t.mv,boss:!!boss,enr:false,et:t.t||"Boss",bi:boss?BOSS.indexOf(t):-1};
}
function setup(e,tour,keep){
 F=Object.assign({php:keep?keep.php:maxhp(),pmax:maxhp(),menu:"main",anim:"",dmg:"",hE:0,hP:0,lP:0,lE:0,vfx:[],over:false,next:false,tour:tour||0,pp:keep?keep.pp:null,pb:{buff:0,guard:0,poison:0,burn:0,stun:0},eb:{bleed:0,burn:0,poison:0,ps:0,stun:0,guard:0},log:(e.tower?towerIntro(e.tower):"")+(ttn()?`<b>${S.name} ${ttn()}</b> tritt an!<br>`:"")+(e.boss?`${e.name} versperrt dir den Weg! Das wird ein harter Kampf.`:"Ein fremder Gegner fordert dich heraus! Was tust du?")},e);
 if(!F.pp){F.pp={};SK.forEach((s,i)=>F.pp[i]=s.pp)}
 save();fight();
}
function startFight(){if(S.en<2)return;S.en-=2;setup(mk(Math.max(1,lvl()+rnd(-1,1)),ET[rnd(0,4)]))}
function startTour(){if(S.en<4||S.gold<20)return;S.en-=4;S.gold-=20;setup(mk(Math.max(1,lvl()),ET[rnd(0,4)]),1)}
function startTower(){if(!S.tunl||S.en<4)return;S.en-=4;towerFloor(1)}
function towerFloor(n,keep){if(n>1&&(n-1)%5===0)setTimeout(()=>sfx("gong"),300);const b=n%5===0,bs=BOSS[(n/5-1)%BOSS.length],e=b?mk(bs.L+Math.floor(n/3),bs,true):mk(lvl()+Math.floor(n/2),ET[rnd(0,4)]);e.tower=n;setup(e,0,keep)}
function rebirth(){if(S.boss<BOSS.length)return;if(!confirm("Wiedergeburt: Stufe, Gold, Ruhm, Ausrüstung und Bossfortschritt werden zurückgesetzt. Du behältst verzauberte und geschmiedete Gegenstände, Tränke, Materialien, Berufsstufen, Pokale und Turmrekord und erhältst +10 % Schaden, Gold und EP – die Gegner werden aber 8 % stärker. Fortfahren?"))return;S.star++;for(const o of[S.up,S.ru])for(const k of Object.keys(o))if(/^[wa]\d$/.test(k))delete o[k];Object.assign(S,{exp:0,ruhm:0,gold:50,st:3,au:3,ge:3,w:0,a:0,s:0,boss:0});msg=`Du wirst wiedergeboren! Wiedergeburt ${S.star} 🌟`;sfx("level");save();home()}
function nextTour(){if(F.tower)return towerFloor(F.tower+1,{php:Math.min(F.pmax,F.php+Math.round(F.pmax*.2)),pp:F.pp});const k={php:Math.min(F.pmax,F.php+Math.round(F.pmax*.3)),pp:F.pp},r=F.tour+1;setup(mk(Math.max(1,lvl()+r-1),ET[rnd(0,4)]),r,k)}
function startBoss(){const b=BOSS[S.boss];if(!b||S.en<3||S.ruhm<b.req)return;S.en-=3;setup(mk(b.L,b,true))}
function leaveTower(){const d=F.over?F.tower:F.tower-1;F.over=true;msg=`Du verlässt den Turm nach ${d} geschafften Etagen. Rekord: Etage ${S.tbest}.`;save();home()}
function fmenu(m){F.menu=m;Object.assign(F,{anim:"",dmg:"",hE:0,hP:0,lP:0,lE:0,vfx:[]});fight()}
function fight(){
 const f=F;if(!f.over)musicSet(f.boss?"boss":f.tour?"tour":f.tower?"tower":"battle");const ic=(o,m)=>Object.keys(m).filter(k=>o[k]>0).map(k=>m[k]).join("");
 let ui;
 if(f.over)ui=f.next?`<button class="p" style="grid-column:1/-1" onclick="nextTour()">Nächster Gegner ⚔️</button>${f.tower?'<button style="grid-column:1/-1" onclick="leaveTower()">🏰 Turm verlassen</button>':""}`:`<button class="p" style="grid-column:1/-1" onclick="home()">Zurück zur Burg</button>`;
 else if(f.menu==="skills")ui=hasSk().map(i=>{const s=SK[i],pp=f.pp[i];return `<button ${pp<1?"disabled":""} onclick="useSkill(${i})">${s.n}<small>${s.pp<99?pp+"/"+s.pp+"× · ":""}${s.d}</small></button>`}).join("")+`<button onclick="fmenu('main')">← Zurück</button>`;
 else if(f.menu==="items")ui=IT.map(t=>`<button ${S.it[t.k]<1?"disabled":""} onclick="useItem('${t.k}')">${t.e} ${t.n} ×${S.it[t.k]}<small>${t.d}</small></button>`).join("")+`<button onclick="fmenu('main')">← Zurück</button>`;
 else ui=`<button class="p" onclick="fmenu('skills')">⚔️ Kämpfen</button><button onclick="fmenu('items')">🎒 Tränke</button>${f.tower?'<button onclick="leaveTower()" style="grid-column:1/-1">🏳️ Turm verlassen</button>':f.boss||f.tour?"":'<button onclick="flee()" style="grid-column:1/-1">🏃 Fliehen</button>'}`;
 const dm=(w)=>{const v=w==="e"?f.hE:f.hP;return v?`<span class="dmg ${w==="p"?"late":""}" style="left:30px">-${v}</span>`:""};
 app.innerHTML=`<div class="scene fs">${f.tower?TBG(ttier(f.tower)):BG}
 <div class="box eb"><b>${f.name}</b> <span class="mut">Lv${f.lvl}${f.tour?" · Turnier "+f.tour+"/3":""}${f.tower?" · Etage "+f.tower:""}${f.boss?" · BOSS":""}</span> ${ic(f.eb,{bleed:"🩸",burn:"🔥",poison:"☠️",stun:"💫",guard:"🛡️"})}${bar(f.ehp,f.emax,"#c0392b")}<span class="mut">${Math.max(0,f.ehp)}/${f.emax}</span></div>
 <div class="es ${f.boss?"big":""} ${f.hE?"hit":""}">${dm("e")}<div class="lg ${f.lE?"lungeE":""}"><div class="kw ${f.ko==="e"?(f.boss?"koB":"koE"):f.ko==="p"?"cheerE":""}">${f.boss&&f.bi>=0?bossSvg(f.bi):knight(f.tier,f.tier,Math.min(3,Math.floor(f.lvl/3)),true,f.tint)}</div></div></div>
 <div class="ps ${f.hP?"hit late":""}">${dm("p")}<div class="lg ${f.lP?"lungeP":""}"><div class="kw ${f.ko==="p"?"koP":f.ko==="e"?"cheer":""}">${pk()}</div></div></div>
 <div class="box pb"><b>${S.name}</b> <span class="mut">Lv${lvl()}</span>${tl()} ${ic(f.pb,{buff:"💥",guard:"🛡️",poison:"☠️",burn:"🔥",stun:"💫"})}${bar(f.php,f.pmax,"#2e8b57")}<span class="mut">${Math.max(0,f.php)}/${f.pmax}</span></div>${VXH(f)}</div>
 <div class="msg">${f.log}</div><div class="grid">${ui}</div>`;
}
function fin(l){F.log=l.join("<br>");F.menu="main";fight()}
function useSkill(i){
 const f=F,s=SK[i],l=[`${S.name} setzt <b>${s.n}</b> ein!`];
 if(s.pp<99){if(f.pp[i]<1)return;f.pp[i]--}
 f.anim="";f.dmg="";f.hE=0;f.hP=0;f.lP=s.pw>0?1:0;f.lE=0;f.vfx=[];
 if(Math.random()*100>=s.acc){l.push("Der Angriff geht daneben!");sfx("miss");f.vfx.push(["miss","vE",0])}
 else{f.vfx.push([SKFX[i],[3,5,9].includes(i)?"vP":"vE",0]);
  if(s.pw>0){
   let d=5+Math.floor(S.st*1.3)+wBon();d=d*s.pw*(f.pb.buff>0?1.5:1)*(1+.1*S.star)+rnd(0,3);
   const crit=Math.random()<Math.min(.6,S.ge*.03+fxv("crit"));if(crit){d*=1.5;S.crits++}if(f.eb.guard)d*=.5;
   d=Math.max(1,Math.round(d-f.def));f.ehp-=d;f.anim="e";f.dmg=d;f.hE=d;sfx(crit?"crit":"hit");l.push((crit?"<b>Kritischer Treffer!</b> ":"")+`${d} Schaden.`);encHit(d,l);
  }
  if(s.fx==="stun"&&Math.random()<.4){f.eb.stun=1;l.push("Der Gegner ist betäubt! 💫")}
  if(s.fx==="bleed"){f.eb.bleed=3;l.push("Der Gegner blutet! 🩸")}
  if(s.fx==="heal"){const o=f.php;f.php=Math.min(f.pmax,f.php+Math.round(f.pmax*.35));l.push(`Du heilst ${f.php-o} LP. 💚`);sfx("heal")}
  if(s.fx==="buff"){sfx("buff");f.pb.buff=3;l.push("Dein Schaden steigt! 💥")}
  if(s.fx==="guard"){sfx("buff");f.pb.guard=3;l.push("Du gehst in Verteidigung! 🛡️")}
 }
 enemyTurn(l);
}
function useItem(k){
 const f=F;if(S.it[k]<1)return;S.it[k]--;const t=IT.find(x=>x.k===k),l=[`Du benutzt ${t.n}.`];sfx(k==="k"||k==="e"?"buff":"heal");save();f.anim="";f.dmg="";f.hE=0;f.hP=0;f.lP=0;f.lE=0;f.vfx=[[k==="k"?"roar":k==="e"?"guard":"heal","vP",0]];
 if(k==="h"||k==="H"||k==="x"){const h=k==="h"?40:k==="x"?200:100,b=f.php;f.php=Math.min(f.pmax,f.php+h);l.push(`Du heilst ${f.php-b} LP. 💚`)}
 if(k==="k"){f.pb.buff=3;l.push("Dein Schaden steigt für 3 Runden! 💥")}
 if(k==="g"){f.pb.poison=0;f.pb.burn=0;l.push("Gift und Brand sind geheilt! 💊")}
 if(k==="e"){f.pb.guard=3;l.push("Deine Haut wird hart wie Eisen! 🛡️")}
 enemyTurn(l);
}
function flee(){const l=[];Object.assign(F,{hE:0,hP:0,lP:0,lE:0,vfx:[]});if(F.boss||F.tour||F.tower){F.log="Hier gibt es kein Entkommen!";return fight()}if(Math.random()<Math.min(.9,.5+S.ge*.03)){F.over=true;l.push("Du ergreifst die Flucht! Kein Ruhm, aber auch kein Verlust.");msg="Du bist geflohen.";save();return fin(l)}l.push("Flucht gescheitert!");enemyTurn(l)}
function enemyAct(l){
 const f=F;
 if(f.eb.stun){f.eb.stun=0;l.push(`${f.name} ist betäubt und setzt aus.`);return}
 const tot=f.mv.reduce((a,m)=>a+m[4],0);let r=Math.random()*tot,m=f.mv[0];
 for(const x of f.mv){if(r<x[4]){m=x;break}r-=x[4]}
 l.push(`${f.name} setzt <b>${m[0]}</b> ein!`);if(m[3]!=="guard")f.lE=1;
 if(m[3]==="guard"){f.vfx.push(["guard","vE",1]);f.eb.guard=1;l.push("Der Gegner geht in Deckung. 🛡️")}
 else if(Math.random()*100>=Math.max(25,m[2]-S.ge-fxv("dodge"))){l.push("Du weichst aus!");sfx("miss");f.vfx.push(["dodge","vP",1])}
 else{
  let d=(f.atk+rnd(0,3))*m[1]-aBon()-SH[S.s][2];if(f.pb.guard>0)d*=.5;d=Math.max(1,Math.round(d));f.took=1;f.php-=d;f.anim="p";f.dmg=d;f.hP=d;sfx("hurt");f.vfx.push(["slash","vP",1]);if(m[1]>=1.5)f.vfx.push(["flash","vP",1]);l.push(`Du erleidest ${d} Schaden.`);
  if(m[3]==="poison"){f.pb.poison=4;sfx("poison");f.vfx.push(["poison","vP",1]);l.push("Du bist vergiftet! ☠️")}
  if(m[3]==="burn"&&!fxv("noburn")){f.vfx.push(["fire","vP",1]);f.pb.burn=3;l.push("Du brennst! 🔥")}
  if(m[3]==="stun"&&Math.random()<.5){f.vfx.push(["stun","vP",1]);f.pb.stun=1;l.push("Du bist betäubt! 💫")}
 }
}
function enemyTurn(l){
 const f=F;
 if(f.ehp<=0)return endFight(true,l);
 f.eb.guard=0;
 for(const[k,d,t,e]of[["bleed",4+f.lvl,"blutet","🩸"],["burn",6+f.lvl,"brennt","🔥"],["poison",(4+f.lvl)*Math.max(1,f.eb.ps),"leidet unter Gift","☠️"]])if(f.eb[k]>0){f.ehp-=d;f.eb[k]--;if(k==="poison"&&!f.eb.poison)f.eb.ps=0;l.push(`${f.name} ${t}: ${d} Schaden. ${e}`);if(f.ehp<=0)return endFight(true,l)}
 if(f.boss&&!f.enr&&f.ehp<f.emax/2){f.enr=true;f.atk*=1.3;l.push(`<b>${f.name} gerät in Rage!</b> 😡`)}
 enemyAct(l);
 const rg=fxv("regen");if(rg&&f.php<f.pmax){f.php=Math.min(f.pmax,f.php+rg);l.push(`Deine Rüstung heilt dich um ${rg} LP. 🌙`)}
 if(f.pb.poison>0){const d=2+Math.floor(f.lvl/2);f.took=1;f.php-=d;f.pb.poison--;l.push(`Gift: ${d} Schaden. ☠️`)}
 if(f.pb.burn>0){const d=4+f.lvl;f.took=1;f.php-=d;f.pb.burn--;l.push(`Verbrennung: ${d} Schaden. 🔥`)}
 if(f.pb.buff>0)f.pb.buff--;if(f.pb.guard>0)f.pb.guard--;
 if(f.php<=0)return endFight(false,l);
 if(f.pb.stun){f.pb.stun=0;l.push("Du bist betäubt und verlierst deinen Zug!");enemyAct(l);if(f.php<=0)return endFight(false,l)}
 fin(l);
}
function endFight(win,l){
 const f=F;f.over=true;const old=lvl();AU.want=null;musicStop();f.ko=win?"e":"p";f.vfx.push(win?[f.boss?"bko":"ko","vE",0]:["ko","vP",1]);
 setTimeout(()=>sfx(win&&f.boss?"boom":"fall"),win?850:1850);setTimeout(()=>sfx(win?"win":"lose"),win?(f.boss?2100:1500):2600);
 if(win){
  const m=f.boss?3:1,sm=1+.1*S.star,r=(10+f.lvl*6)*m,g=Math.round((15+f.lvl*8)*m*sm),x=Math.round((15+f.lvl*10)*m*sm);
  S.ruhm+=r;S.gold+=g;S.exp+=x;S.wins++;if(f.php<=5)S.close++;if(!f.took)S.flawless++;l.push(`<b>🏆 Sieg!</b> +${r} Ruhm, +${g} Gold, +${x} EP.`);
  if(f.boss&&!f.tower){S.boss++;if(!S.bk.includes(S.boss-1))S.bk.push(S.boss-1);if(S.boss>=3)S.tunl=1;(BREW[S.boss-1]||[]).forEach(id=>giveE(id,l));S.it.H++;S.it.g++;l.push("Beute: Großer Heiltrank ⚗️ und Gegengift 💊!");msg=`Boss ${f.name} besiegt!`}
  else{if(Math.random()<.3){S.it.h++;l.push("Du findest einen Heiltrank! 🧪")}msg=`Du hast ${f.name} besiegt!`}
  dropMat(f,l);
  if(f.tower){S.tbest=Math.max(S.tbest,f.tower);f.next=true;l.push(`Etage ${f.tower} geschafft! Du verschnaufst kurz (+20 % LP).`);if(f.tower%10===0)towerLoot(l)}
  if(f.tour){if(f.tour<3){f.next=true;l.push(`Turnierrunde ${f.tour}/3 geschafft – du verschnaufst kurz.`)}else{S.troph++;tourLoot(l);S.gold+=100;S.exp+=50;S.ruhm+=30;l.push("<b>🏟️ Turniersieger!</b> Pokal, +100 Gold, +30 Ruhm, +50 EP.");msg="Du hast das Turnier gewonnen!"}}
 }else{const x=Math.floor(S.gold*.1);S.gold-=x;S.ruhm=Math.max(0,S.ruhm-5);S.exp+=5;S.losses++;l.push(`<b>💀 Niederlage.</b> −${x} Gold, −5 Ruhm, +5 EP.`);msg=f.tower?`Der Turm hat dich bezwungen – Rekord: Etage ${S.tbest}.`:f.tour?"Du bist im Turnier ausgeschieden.":"Du wurdest besiegt – trainiere und kehre stärker zurück!"}
 const nl=lvl();if(nl>old){setTimeout(()=>sfx("level"),1500);l.push(`<b>⭐ Stufe ${nl} erreicht!</b>`);const n=nl-old;S.st+=n;S.au+=n;S.ge+=n;l.push(`Stärke, Ausdauer und Geschick steigen um je ${n}! 💪`);SK.filter(s=>s.lv>old&&s.lv<=nl).forEach(s=>l.push(`Neue Fähigkeit: <b>${s.n}</b>!`))}
 checkTitles(l);save();fin(l);
}
home();
</script>
