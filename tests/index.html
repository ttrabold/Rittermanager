<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Rittermanager – Tests</title>
<link rel="stylesheet" href="../css/style.css">
<script>
// Echte Spielstände nie anfassen: localStorage durch einen Speicher im Arbeitsspeicher ersetzen
(()=>{const m={};const mem={getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]},clear:()=>{for(const k in m)delete m[k]},key:i=>Object.keys(m)[i]||null,get length(){return Object.keys(m).length}};
 Object.defineProperty(window,"localStorage",{value:mem,configurable:true})})();
// Keine Seitenreloads und keine echten Downloads im Test
window.__reloads=0;
</script></head>
<body><div id="app"></div>
<script src="../js/util.js"></script><script src="../js/data.js"></script><script src="../js/state.js"></script><script src="../js/audio.js"></script><script src="../js/speech.js"></script><script src="../js/unlock.js"></script><script src="../js/art.js"></script><script src="../js/professions.js"></script><script src="../js/weapons.js"></script><script src="../js/loot.js"></script><script src="../js/day.js"></script><script src="../js/tavern.js"></script><script src="../js/screens.js"></script><script src="../js/combat.js"></script><script src="../js/help.js"></script><script src="../js/companions.js"></script><script src="../js/events.js"></script><script src="../js/story.js"></script><script src="../js/endgame.js"></script><script src="../js/bestiary.js"></script><script src="../js/main.js"></script>
<pre id="out" style="position:fixed;inset:0;overflow:auto;margin:0;padding:12px;background:#111;color:#eee;font:13px monospace;z-index:999"></pre>
<script>
const R=[];let fails=0;
function t(name,fn){try{fn();R.push("✅ "+name)}catch(e){fails++;R.push("❌ "+name+" – "+(e&&e.message||e))}}
const ok=(c,m)=>{if(!c)throw new Error(m||"Bedingung nicht erfüllt")};
AU.mus=false;AU.sfx=false;TTS.on=false;speechSynthesis&&speechSynthesis.cancel&&(speechSynthesis.speak=()=>{});
const newGame=()=>{S=fresh();unlCheck();S.lvl0=1;S.sk=[];qGen();F=null};
const hero=L=>{newGame();S.exp=expFor(L);S.st=S.au=S.ge=3+L-1;S.lvl0=L;S.unl=FEAT.map(f=>f.id);S.tunl=1;S.sk=SK.filter(s=>s.id!=="hieb"&&s.lv<=L).slice(-6).map(s=>s.id);S.gold=99999;S.en=99;Object.keys(S.mat).forEach(k=>S.mat[k]=50);S.pr={sm:{lv:10,xp:0},al:{lv:10,xp:0},ve:{lv:10,xp:0}}};
const win=()=>{let n=0;while(!F.over&&n++<300){F.ehp=0;enemyTurn([])}ok(F.over,"Kampf endet nicht")};

t("Neues Spiel: nur Grundknöpfe",()=>{newGame();home();const b=[...document.querySelectorAll(".grid button")].map(x=>x.textContent);ok(b.length===4,"erwartet 4 Knöpfe, gefunden "+b.length)});
t("Freischaltungen in Reihenfolge",()=>{newGame();const got=[];for(let L=2;L<=20;L++){S.exp=expFor(L);const l=[];levelCheck(l);unlCheck(l);l.filter(x=>x.includes("🔓")).forEach(()=>got.push(L))}ok(got.length>=11,"nur "+got.length+" Freischaltungen")});
t("Alle Bildschirme rendern",()=>{hero(30);for(const f of[home,shop,inv,trader,castleScr,titles,skillsScr,saveScr,compScr,bestScr,()=>{TV.ph="bet";tavern()}])f();for(const w of["sm","al","ve"]){wsTab=w;workshop()}});
t("Abenteuer gewinnen",()=>{hero(10);startFight();if(EVN){EVN=null;setup(mk(10,ET[0]))}win();ok(F.ko==="e")});
t("Schnellkampf",()=>{hero(15);EVN=null;setup(mk(12,ET[2]));quickFight();ok(F.over||F.log.includes("stoppt"),"Schnellkampf endet nicht")});
t("Tastenkürzel",()=>{hero(15);setup(mk(12,ET[0]));const o=F.ehp;document.dispatchEvent(new KeyboardEvent("keydown",{key:"1"}));ok(F.ehp<o||F.log.includes("daneben")||F.log.includes("weicht"),"Taste 1 ohne Wirkung")});
t("Alle Fähigkeiten einsetzbar",()=>{hero(30);for(const s of SK){S.sk=s.id==="hieb"?[]:[s.id];setup(mk(30,ET[0]));F.ehp=F.emax=1e6;useSkill(s.id);ok(!F.log.includes("undefined"),s.id)}});
t("Alle Bosse besiegbar (Ablauf)",()=>{hero(50);for(let i=0;i<BOSS.length;i++){S.boss=i;S.ruhm=1e6;S.en=9;startBoss();win()}ok(S.boss===BOSS.length,"Bossfortschritt "+S.boss);ok(F.epi===1,"Epilog-Knopf fehlt");epilogScr()});
t("Turnier mit 3 Runden",()=>{hero(20);startTour();win();nextTour();win();nextTour();win();ok(S.troph===1,"kein Pokal")});
t("Turm: Etagen, Verlassen, Niederlage",()=>{hero(30);startTower();win();nextTour();win();leaveTower();ok(S.tcur===3,"tcur "+S.tcur);S.en=9;startTower();F.php=0;F.php=1;F.pb.burn=5;F.eb.stun=1;useSkill("hieb");let n=0;while(!F.over&&n++<50){F.php=1;F.pb.burn=5;F.eb.stun=1;useSkill("hieb")}ok(S.tcur===1,"Reset nach Niederlage");ok((S.hall||[]).length===1,"Ruhmeshalle leer")});
t("Vollmond-Werwolf",()=>{hero(20);S.day=5;const n=S.gear.length;startMoon();win();ok(S.gear.length===n+1&&!S.own.includes("mw"),"Mondbeute")});
t("Rivale: alle 7 Duelle",()=>{hero(45);for(let k=0;k<7;k++){S.en=9;startRival();win()}ok(S.rv===7,"rv "+S.rv);ok(S.own.includes("nk"),"Neidklinge fehlt")});
t("Alle Ereignisse und Entscheidungen",()=>{hero(20);for(const ev of EVTS)for(let i=0;i<ev.ch.length;i++){S.it.h=5;S.gold=9999;EVN={ev,res:null};F=null;evScr();evPick(i);if(F&&!F.over)win()}});
t("Begleiter kaufen und wirken",()=>{hero(20);S.bk=[0,1,2,3];for(const c of COMP)compBuy(c.id);ok(S.comp.length===4);S.cmp=null;compSet("ross");ok(enMax()===7);S.cmp="falke";setup(mk(20,ET[0]));F.ehp=F.emax=1e6;for(let k=0;k<30;k++)useSkill("hieb");S.cmp="knappe";setup(mk(20,ET[0]));F.ehp=F.emax=1e6;F.atk=0;F.fx={};F.php=Math.round(F.pmax*.2);enemyTurn([]);ok(F.knUsed===1,"Knappe hilft nicht")});
t("Bestiarium füllt sich",()=>{hero(20);S.bst={};setup(mk(10,ET[3]));win();ok((S.bst.et3||{}).w===1);bestScr()});
t("Legendäre Aufwertung bis +10",()=>{hero(30);for(let n=0;n<10;n++){S.en=9;upgrade("w"+S.w)}ok(S.up["w"+S.w]===10,"Stufe "+S.up["w"+S.w])});
const WFX=["burn","poison","stun","crit","life"],AFX=["hp","regen","dodge","noburn"];
t("Zufallsbeute: Generator",()=>{newGame();for(const il of[8,50])for(let r=0;r<4;r++)for(let i=0;i<30;i++){const it=genItem(il,r);
  ok(Object.keys(it.fx).length===r+1,`r${r}: ${Object.keys(it.fx).length} Effekte`);ok(["w","a","sh"].includes(it.s),"Slot "+it.s);
  ok((it.s==="w"?WFX:AFX).length&&Object.keys(it.fx).every(k=>(it.s==="w"?WFX:AFX).includes(k)),"falscher Effekt "+Object.keys(it.fx));
  if(it.s==="w")ok(it.cat in WCAT,"Waffenart "+it.cat);ok(it.b>=1,"Grundwert "+it.b);ok(Object.values(it.fx).every(v=>v>0&&!isNaN(v)),"Effektwert "+JSON.stringify(it.fx));
  ok(it.d===fxDesc(it.fx),"Beschreibung");ok(it.r===r&&it.gen===1&&/^g\d+$/.test(it.id),"Felder")}
 ok(genItem(30,3,"w","axt").cat==="axt","Waffenart vorgegeben");ok(genItem(30,0,"sh").s==="sh","Slot vorgegeben");ok(itm("fl").n==="Flammenklinge","itm EI");
 const g=genItem(20,1);S.gear.push(g);ok(itm(g.id)===g,"itm gear");ok(rarRoll([0,0,0,1])===3&&rarRoll([1,0,0,0])===0,"rarRoll")});
const gearAdd=(il,r,s,cat)=>{const it=genItem(il,r,s,cat);S.gear.push(it);return it};
t("Zufallsbeute: Schild-Slot",()=>{hero(30);S.s=3;const base=sBon();const it=gearAdd(30,1,"sh");equipE(it.id);ok(S.es===it.id,"nicht angelegt");ok(sBon()===it.b,"sBon "+sBon());
 for(const k in it.fx)ok(fxv(k)>=it.fx[k],"Effekt "+k+" fehlt");ok(enemyAct.toString().includes("sBon()"),"Gegnerschaden ohne sBon");equipE(it.id);ok(!S.es&&sBon()===base,"ablegen")});
t("Zufallsbeute: Aufwerten und Runen",()=>{hero(30);const w=gearAdd(30,0,"w","bogen"),sh=gearAdd(30,0,"sh");equipE(w.id);equipE(sh.id);ok(eqCat()==="bogen","Waffenart");
 const wb=wBon(),sb=sBon();upgrade(w.id);upgrade(sh.id);ok(S.up[w.id]===1&&S.up[sh.id]===1,"nicht aufgewertet");ok(wBon()===wb+2&&sBon()===sb+1,"Bonus "+wBon()+"/"+sBon());
 const hp=fxv("hp");rune("r6",sh.id);ok((S.ru[sh.id]||[]).includes("r6"),"Rune nicht auf Schild");ok(fxv("hp")===hp+15,"Rune wirkt nicht");ok(invItems().includes(sh.id)&&invItems().includes(w.id),"invItems")});
t("Alter Spielstand ohne gear/es",()=>{S=Object.assign(fresh(),{own:["fl"],ew:"fl",exp:expFor(10)});delete S.gear;delete S.es;migrate();ok(Array.isArray(S.gear)&&S.es===null,"Migration");
 ok(eq("w").id==="fl","alte Waffe");inv();ok(!/undefined|NaN/.test(document.getElementById("app").innerHTML),"undefined/NaN im Inventar")});
t("Wiedergeburt behält Zufallsbeute",()=>{hero(50);S.s=3;const it=gearAdd(40,2,"sh");equipE(it.id);S.up.s3=2;S.up[it.id]=1;const n=S.gear.length;S.boss=BOSS.length;doRebirth("gold");
 ok(S.gear.length===n&&S.es===it.id,"Beute weg");ok(S.up.s3===undefined,"Marktschild-Aufwertung bleibt");ok(S.up[it.id]===1,"Aufwertung der Beute weg")});
t("Zufallsbeute: Quellen",()=>{hero(30);S.ruhm=1e6;const own=S.own.length;let n=S.gear.length;startBoss();win();ok(S.gear.length===n+2,"Story-Boss: "+(S.gear.length-n));ok(S.own.length===own,"feste Beute vergeben");
 n=S.gear.length;tourLoot([]);ok(S.gear.length===n+1,"Turnier");n=S.gear.length;moonLoot([]);ok(S.gear.length===n+1&&S.gear[n].r>=1,"Mond");
 n=S.gear.length;S.tunl=1;S.tcur=10;startTower();win();ok(S.gear.length===n+1&&S.gear[n].r>=1,"Turm Etage 10");n=S.gear.length;F=null;S.tcur=7;startTower();win();ok(S.gear.length===n,"Turm Etage 7 ohne Beute")});
t("Zufallsbeute: Auto-Anlegen",()=>{hero(30);S.ew=null;const l=[];const a=lootGive("boss",60,l);if(a.s==="w")ok(S.ew===a.id,"leerer Slot nicht belegt");
 const w=gearAdd(30,0,"w");equipE(w.id);for(let i=0;i<10;i++)lootGive("boss",60,[]);ok(S.ew===w.id,"angelegte Beute ersetzt");ok(l.join("").includes(a.n),"Meldung")});
t("Zufallsbeute: Zerlegen",()=>{hero(30);const it=gearAdd(30,3,"a");S.up[it.id]=2;const m={...S.mat};ok(salvage(it.id),"zerlegen fehlgeschlagen");
 ok(S.mat.ds===m.ds+1&&S.mat.mi===m.mi+2,"Ertrag 🟠");ok(S.mat.le===m.le+3&&S.mat.ez===m.ez+1,"Rückgabe Aufwertung "+(S.mat.le-m.le)+"/"+(S.mat.ez-m.ez));ok(!itm(it.id)&&S.up[it.id]===undefined,"noch da");
 const e=gearAdd(30,0,"w");equipE(e.id);ok(!salvage(e.id)&&itm(e.id),"angelegtes zerlegt");const g1=gearAdd(30,0,"a"),b1=gearAdd(30,1,"a");const k=salvageAll(0);ok(k===1&&!itm(g1.id)&&itm(b1.id)&&itm(e.id),"salvageAll")});
t("Zufallsbeute: Beutel voll",()=>{hero(30);S.tunl=1;F=null;for(let i=0;i<=BAG;i++)gearAdd(30,0);ok(bagFull(),"nicht voll");const en=S.en;startTower();startTour();ok(S.en===en,"trotz vollem Beutel gestartet");
 home();ok(document.getElementById("app").innerHTML.includes("Beutel voll"),"Hinweis fehlt");salvageAll(0);ok(!bagFull(),"aufräumen")});
t("Zufallsbeute: Vergleich",()=>{hero(30);const a=gearAdd(30,1,"w"),b=gearAdd(60,1,"w");equipE(a.id);const h=cmpHtml(b);ok(/[▲▼]/.test(h),"kein Vergleich: "+h)});
t("Zufallsbeute: Export behält Beute",()=>{hero(20);gearAdd(20,2,"sh");const d=impParse(expStr());ok(d.gear.length===S.gear.length&&d.gear[0].id===S.gear[0].id,"Beute fehlt im Export")});
t("Kriegskasse: ab Boss 6, einmal am Tag",()=>{newGame();S.exp=expFor(30);S.lvl0=30;S.gold=99999;unlCheck();ok(!has("kasse"),"zu früh frei");S.boss=6;unlCheck();ok(has("kasse"),"nicht frei");home();ok(document.body.innerHTML.includes("Kriegskasse"),"Knopf fehlt");
 const g=S.gold,r=S.ruhm;kasseGive();ok(S.gold===g-kasseCost()&&S.ruhm===r+kasseRuhm(),"Tausch falsch");kasseGive();ok(S.gold===g-kasseCost(),"zweimal am Tag");S.day++;kasseGive();ok(S.gold===g-2*kasseCost(),"neuer Tag geht nicht");
 S.day++;S.gold=kasseCost()-1;kasseGive();ok(S.kasse!==S.day,"ohne genug Gold")});
t("Taschendiebe: höchstens fester Betrag",()=>{hero(20);S.gold=100000;EVT[EVT.length-1][1]();ok(S.gold===100000-(50+lvl()*15),"Diebstahl nicht gedeckelt");S.gold=500;EVT[EVT.length-1][1]();ok(S.gold===450,"10 % bei wenig Gold")});
t("Drachenschuppen: Turm nur jede 10. Etage",()=>{hero(30);const ds=()=>S.mat.ds;let a=ds();dropMat({boss:true,tower:5,et:"Ritter",lvl:30},[]);ok(ds()===a,"Etage 5 gab Schuppe");dropMat({boss:true,tower:10,et:"Ritter",lvl:30},[]);ok(ds()===a+1,"Etage 10 ohne Schuppe");a=ds();dropMat({boss:true,et:"Ritter",lvl:30},[]);ok(ds()>=a+1,"Story-Boss ohne Schuppe")});
t("Verzierungen, Söldner, Tavernenrunde",()=>{hero(30);S.bk=[0,1,2];for(const d of DECO)decoBuy(d.id);ok(S.deco.length===DECO.length);home();castleScr();mercHire();ok(S.merc===1);S.boss=2;S.ruhm=1e6;startBoss();ok(F.merc===1&&!S.merc);tavRound();ok(S.round===S.day)});
t("Wiedergeburt mit Segen",()=>{hero(50);S.boss=12;rebirth();doRebirth("slot");ok(skMax()===7&&S.star===1&&lvl()===1);S.boss=12;doRebirth("gold");ok(blessV("gold")===1)});
t("Nacht: Erträge, Aufträge, Animation",()=>{hero(20);S.bld={kaserne:1,garten:2,mine:2,arkan:1,schatz:1};S.en=S.enStart-5;const h=S.mat.hk;newDay();ok(S.mat.hk>=h+4,"keine Garten-Erträge");nightClose(home)});
t("Export / Import",()=>{hero(12);S.name="Exporttest";const str=expStr(),d=impParse(str);ok(d.name==="Exporttest");let bad=false;try{impParse("Quatsch")}catch(e){bad=true}ok(bad,"ungültiger Text akzeptiert")});
t("Taverne: Partie spielen",()=>{hero(20);S.tav=null;TV.o="gustl";TV.bet=10;tvStart();tvSel(0);tvRoll();ok(TV.ph==="done")});
t("Werkstatt: brauen, schmieden, Rune",()=>{hero(20);brew("h");forge("c1");rune("r1","w"+S.w);ok((S.ru["w"+S.w]||[]).includes("r1"))});
t("Hinweiskarten",()=>{hero(20);S.hints={};inv();ok(document.querySelector(".hint"));hintOk("inv",document.querySelector(".hint button"));inv();ok(!document.querySelector(".hint"))});
t("Keine 'undefined'/'NaN' im Burgbildschirm",()=>{hero(25);home();const tx=document.body.innerText;ok(!/undefined|NaN/.test(tx),"gefunden")});
t("Waffenarten: kaufen, Wirkung, Modelle",()=>{hero(20);for(const c of Object.keys(WCAT)){buyW(c,2);ok(eqCat()===c,c);setup(mk(20,ET[0]));F.ehp=F.emax=1e6;useSkill("hieb");ok(!F.log.includes("NaN"),c+" NaN");ok(pk().length>500,c+" Modell")}home();inv();shop()});
t("Gegner mit Waffenarten und Magier",()=>{hero(25);const cats=new Set();for(let k=0;k<200;k++){const e=mk(25,ET[rnd(0,ET.length-1)]);cats.add(e.look.wcat);if(e.look.wi){const it=EI.find(x=>x.id===e.look.wi);ok((it.cat||"schwert")===e.look.wcat,"Waffe passt nicht")}enemyKn(e)}ok(cats.size>=6,"nur "+cats.size+" Arten")});
t("Upgrades auf Nicht-Schwert",()=>{hero(20);buyW("axt",3);upgrade(wKey());ok(S.up["w:axt:3"]===1);ok(iname("w").includes("+1"))});
document.getElementById("out").textContent=`Rittermanager – automatische Tests\n${R.length-fails}/${R.length} bestanden\n\n`+R.join("\n");
window.__testResult={total:R.length,fails,lines:R};
</script></body></html>
